<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .nav-links a { color: #fff; text-decoration: none; margin-left: 1.25rem; opacity: .85; }
        .nav-links a:hover { opacity: 1; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus, .form-select:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        .text-muted-sm { font-size: .8rem; color: #6c8394; }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-mark" th:href="@{/vista/libros}">BIBLIOTECA</a>
            <div class="nav-links ms-auto">
                <a th:href="@{/vista/libros}">Libros</a>
                <a th:href="@{/vista/usuarios}">Usuarios</a>
                <a th:href="@{/vista/prestamos}">Préstamos</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Circulación</p>
                <h1 class="h2 mb-0">Préstamos</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${#lists.size(prestamos)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar préstamo</h2>
                    <form th:action="@{/vista/prestamos/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="isbn">Libro disponible</label>
                            <select id="isbn" name="isbn" class="form-select" required>
                                <option value="">Selecciona un libro</option>
                                <option th:each="libro : ${librosDisponibles}" th:value="${libro.isbn}"
                                        th:text="${libro.titulo} + ' (ISBN ' + (${libro.codigoIsbn} ?: 'sin ISBN') + ') - ' + ${libro.numejemplares} + ' disponibles'"></option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="socioId">Socio</label>
                            <select id="socioId" name="socioId" class="form-select" required>
                                <option value="">Selecciona un socio</option>
                                <option th:each="socio : ${socios}" th:value="${socio.id}"
                                        th:text="${socio.nombre} + ' ' + ${socio.apellidos}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="fechaLimite">Fecha límite de devolución (opcional)</label>
                            <input id="fechaLimite" name="fechaLimite" class="form-control" type="date">                            
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Registrar préstamo</button>
                    </form>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Historial</h2><input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar libro o socio"></div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaPrestamos">
                            <thead><tr><th>ID</th><th>Libro</th><th>Socio</th><th>Préstamo</th><th>Límite</th><th>Estado</th><th>Multa</th><th class="text-end">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="item : ${prestamos}">
                                    <td th:text="${item.id}"></td>
                                    <td>
                                        <div th:text="${item.libro.titulo}"></div>
                                        <div class="text-muted-sm" th:text="'ISBN ' + (${item.libro.codigoIsbn} ?: 'sin ISBN')"></div>
                                    </td>
                                    <td>
                                        <div th:text="${item.socio.nombre} + ' ' + ${item.socio.apellidos}"></div>
                                        <div class="text-muted-sm" th:text="${item.socio.correoelectronico}"></div>
                                    </td>
                                    <td th:text="${#temporals.format(item.fechaPrestamo, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td th:text="${#temporals.format(item.fechaLimite, 'dd/MM/yyyy')}"></td>
                                    <td>
                                        <span th:if="${item.activo and !item.vencido}" class="badge text-bg-warning">Activo</span>
                                        <span th:if="${item.vencido}" class="badge text-bg-danger">Vencido</span>
                                        <span th:unless="${item.activo}" th:text="'Devuelto ' + ${#temporals.format(item.fechaDevolucion, 'dd/MM/yyyy')}"></span>
                                    </td>
                                    <td th:text="${item.multa > 0} ? ('$' + ${#numbers.formatDecimal(item.multa, 1, 2)}) : '-'"></td>
                                    <td class="text-end text-nowrap">
                                        <form th:if="${item.fechaDevolucion == null}" class="d-inline" th:action="@{/vista/prestamos/{id}/devolver(id=${item.id})}" method="post">
                                            <button class="btn btn-outline-success btn-sm" type="submit">Devolver</button>
                                        </form>
                                        <form class="d-inline" th:action="@{/vista/prestamos/{id}/eliminar(id=${item.id})}" method="post">
                                            <button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('¿Eliminar este préstamo?')">Eliminar</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(prestamos)}"><td colspan="8" class="text-center text-secondary py-4">No hay préstamos registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('fechaLimite').min = new Date().toISOString().split('T')[0];
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaPrestamos tbody tr').forEach(function (row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
